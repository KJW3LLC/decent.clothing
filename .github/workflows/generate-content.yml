name: Generate Clothing Article

on:
  schedule:
    # Run daily at 10:17 AM UTC (5:17 AM EST / 2:17 AM PST) - off-peak time
    - cron: '17 10 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: generate-clothing-article-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON files
        run: npm run validate

      - name: Generate new article
        id: generate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: npm run generate

      - name: Fix formatting inconsistencies
        if: steps.generate.outputs.exhausted != 'true'
        run: |
          npm run fix-formatting
          node scripts/fix-horizontal-rules.js

      - name: Retry missing guide images
        if: steps.generate.outputs.exhausted != 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/add-images-retroactive.js

      - name: Check for changes
        if: steps.generate.outputs.exhausted != 'true'
        id: git-check
        run: |
          # Stage first so new, previously untracked guide/image files are included.
          git add --all -- _guides/ generated-topics.json assets/images/guides/
          if git diff --cached --quiet; then
            echo "::error::Generator completed without producing a committable article"
            exit 1
          fi

          new_guides="$(git diff --cached --name-only --diff-filter=A -- '_guides/*.md')"
          if [ -z "$new_guides" ]; then
            echo "::error::Generator changed files but did not create a new guide"
            exit 1
          fi

          echo "New guide(s):"
          echo "$new_guides"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Validate series navigation (informational)
        if: steps.git-check.outputs.changes == 'true'
        continue-on-error: true
        run: npm run validate:series

      - name: Commit and push new article
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _guides/ generated-topics.json assets/images/guides/
          git commit -m "Add new clothing article [automated] - formatting verified"
          git pull --rebase origin main
          git push
